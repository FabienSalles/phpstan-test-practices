name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}, PHPUnit ${{ matrix.phpunit }} (${{ matrix.dependencies }} dependencies)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        dependencies: [lowest, highest]
        phpunit: ['11.5', '12.0']
        exclude:
          - php: '8.2'
            phpunit: '12.0'
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer update --no-interaction --no-progress ${{ matrix.dependencies == 'lowest' && '--prefer-lowest' || '' }} --with phpunit/phpunit:^${{ matrix.phpunit }}
      - run: composer ci
